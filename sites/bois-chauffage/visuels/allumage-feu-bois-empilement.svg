<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 420" role="img" aria-label="Coupe d'un foyer de poêle à bois préparé pour l'allumage par le haut. En bas, deux ou trois bûches espacées, sans toucher les parois. Au-dessus, une couche de bûchettes croisées, puis du petit bois en pyramide, et l'allume-feu au sommet. La flamme part du haut et descend vers les bûches, comme une bougie, pendant que l'air entre par le bas avec l'arrivée d'air grande ouverte.">
<defs>
<marker id="dn" viewBox="0 0 10 10" refX="5" refY="9" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,1 L5,10 L10,1" fill="none" stroke="#C9531A" stroke-width="2"/></marker>
<marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M1,0 L10,5 L1,10" fill="none" stroke="#3A83B8" stroke-width="2"/></marker>
</defs>

<text x="230" y="34" text-anchor="middle" font-size="14" font-weight="700" fill="#2E8B62" letter-spacing=".5">ALLUMAGE PAR LE HAUT</text>

<!-- foyer -->
<path d="M70,370 L70,70 L390,70 L390,370 Z" fill="none" stroke="currentColor" stroke-width="2.4"/>
<line x1="70" y1="340" x2="390" y2="340" stroke="currentColor" stroke-width="1.4" opacity=".4"/>
<text x="230" y="362" text-anchor="middle" font-size="11" fill="currentColor" opacity=".6">sole du foyer</text>

<!-- bûches -->
<g fill="none" stroke="currentColor" stroke-width="2">
<ellipse cx="150" cy="315" rx="30" ry="24"/><ellipse cx="150" cy="315" rx="12" ry="9" opacity=".5"/>
<ellipse cx="230" cy="315" rx="30" ry="24"/><ellipse cx="230" cy="315" rx="12" ry="9" opacity=".5"/>
<ellipse cx="310" cy="315" rx="30" ry="24"/><ellipse cx="310" cy="315" rx="12" ry="9" opacity=".5"/>
</g>

<!-- bûchettes croisées -->
<g stroke="currentColor" stroke-width="7" stroke-linecap="round" opacity=".75">
<line x1="120" y1="280" x2="340" y2="280"/>
<line x1="130" y1="266" x2="330" y2="266"/>
</g>

<!-- petit bois en pyramide -->
<g stroke="currentColor" stroke-width="4" stroke-linecap="round" opacity=".7">
<line x1="160" y1="252" x2="300" y2="252"/>
<line x1="175" y1="242" x2="285" y2="242"/>
<line x1="190" y1="232" x2="270" y2="232"/>
<line x1="205" y1="222" x2="255" y2="222"/>
</g>

<!-- allume-feu -->
<rect x="218" y="206" width="24" height="12" rx="2" fill="#C9531A" opacity=".55"/>

<!-- flamme -->
<path d="M230,204 C214,180 238,168 228,144 C250,164 254,186 244,204 Z" fill="#C9531A" opacity=".85"/>

<!-- descente du feu -->
<line x1="360" y1="150" x2="360" y2="300" stroke="#C9531A" stroke-width="2.2" marker-end="url(#dn)"/>

<!-- air -->
<line x1="20" y1="330" x2="92" y2="330" stroke="#3A83B8" stroke-width="2.2" marker-end="url(#ar)"/>
<text x="20" y="318" font-size="11" fill="#3A83B8" font-weight="600">air</text>

<!-- légendes -->
<g font-size="12.5" fill="currentColor">
<line x1="248" y1="160" x2="440" y2="120" stroke="currentColor" stroke-width="1" opacity=".35"/>
<text x="448" y="116" font-weight="600">4. On allume en haut</text>
<text x="448" y="132" opacity=".75">arrivée d'air grande ouverte</text>

<line x1="244" y1="212" x2="440" y2="180" stroke="currentColor" stroke-width="1" opacity=".35"/>
<text x="448" y="178" font-weight="600">3. Allume-feu naturel</text>
<text x="448" y="194" opacity=".75">jamais de papier imprimé</text>

<line x1="300" y1="240" x2="440" y2="240" stroke="currentColor" stroke-width="1" opacity=".35"/>
<text x="448" y="238" font-weight="600">2. Bûchettes puis petit bois</text>
<text x="448" y="254" opacity=".75">en pyramide, du plus gros au plus fin</text>

<line x1="340" y1="315" x2="440" y2="305" stroke="currentColor" stroke-width="1" opacity=".35"/>
<text x="448" y="302" font-weight="600">1. Deux ou trois bûches sèches</text>
<text x="448" y="318" opacity=".75">espacées, sans toucher les parois</text>
</g>

<text x="372" y="230" font-size="11" fill="#C9531A" font-weight="600" transform="rotate(90 372 230)" text-anchor="middle">le feu descend</text>
</svg>
