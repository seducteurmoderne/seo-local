<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 730" role="img" aria-label="Coupe d'un poêle à pellets situant les douze points d'entretien, classés par fréquence : creuset, bac à cendres et vitre tous les deux à trois jours ; chambre de combustion, racleurs d'échangeur et joint de porte chaque semaine ; conduits internes, réservoir et grille d'air chaque mois ; extracteur de fumées, bougie d'allumage et sondes une fois par an par un professionnel.">
<defs>
<marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="currentColor"/></marker>
<g id="badge"><circle r="11" fill="none" stroke-width="2"/></g>
</defs>

<!-- corps -->
<rect x="210" y="70" width="250" height="400" rx="6" fill="none" stroke="currentColor" stroke-width="2.4"/>
<rect x="226" y="470" width="22" height="18" fill="none" stroke="currentColor" stroke-width="2"/>
<rect x="422" y="470" width="22" height="18" fill="none" stroke="currentColor" stroke-width="2"/>
<text x="335" y="58" text-anchor="middle" font-size="12" fill="currentColor" opacity=".5" letter-spacing="1.2">COUPE — FAÇADE À GAUCHE</text>

<!-- réservoir -->
<path d="M335,88 L450,88 L450,168 L392,205 L362,205 L335,168 Z" fill="currentColor" opacity=".07"/>
<path d="M335,88 L450,88 L450,168 L392,205 L362,205 L335,168 Z" fill="none" stroke="currentColor" stroke-width="2"/>
<g fill="currentColor" opacity=".45">
<circle cx="356" cy="108" r="4"/><circle cx="372" cy="104" r="4"/><circle cx="390" cy="109" r="4"/>
<circle cx="408" cy="103" r="4"/><circle cx="426" cy="108" r="4"/><circle cx="364" cy="122" r="4"/>
<circle cx="382" cy="120" r="4"/><circle cx="400" cy="123" r="4"/><circle cx="418" cy="120" r="4"/>
<circle cx="374" cy="137" r="4"/><circle cx="394" cy="139" r="4"/><circle cx="412" cy="136" r="4"/>
</g>

<!-- vis sans fin -->
<line x1="377" y1="205" x2="300" y2="290" stroke="currentColor" stroke-width="15" opacity=".13" stroke-linecap="round"/>
<line x1="377" y1="205" x2="300" y2="290" stroke="currentColor" stroke-width="1.6" opacity=".65"/>
<g stroke="currentColor" stroke-width="1.4" opacity=".5">
<line x1="368" y1="209" x2="376" y2="219"/><line x1="356" y1="222" x2="364" y2="232"/>
<line x1="344" y1="235" x2="352" y2="245"/><line x1="332" y1="248" x2="340" y2="258"/>
<line x1="320" y1="261" x2="328" y2="271"/>
</g>
<text x="398" y="252" font-size="11.5" fill="currentColor" opacity=".6">vis sans fin</text>

<!-- échangeur -->
<g fill="none" stroke="currentColor" stroke-width="1.8" opacity=".8">
<circle cx="245" cy="228" r="11"/><circle cx="275" cy="228" r="11"/><circle cx="305" cy="228" r="11"/>
<circle cx="335" cy="228" r="11"/><circle cx="365" cy="228" r="11"/>
</g>
<line x1="222" y1="105" x2="340" y2="105" stroke="currentColor" stroke-width="2.4"/>
<circle cx="216" cy="105" r="7" fill="currentColor" opacity=".55"/>
<line x1="290" y1="107" x2="290" y2="214" stroke="currentColor" stroke-width="1.4" opacity=".45" stroke-dasharray="4 3"/>

<!-- chambre + creuset -->
<rect x="230" y="246" width="120" height="94" fill="none" stroke="currentColor" stroke-width="1.4" stroke-dasharray="5 4" opacity=".6"/>
<path d="M287,286 C278,272 292,264 286,252 C299,264 302,276 297,286 Z" fill="#C9531A" opacity=".85"/>
<path d="M262,290 L312,290 L305,322 L269,322 Z" fill="none" stroke="currentColor" stroke-width="2.4"/>
<g stroke="currentColor" stroke-width="2" opacity=".65">
<line x1="273" y1="322" x2="273" y2="315"/><line x1="287" y1="322" x2="287" y2="315"/><line x1="301" y1="322" x2="301" y2="315"/>
</g>

<!-- porte + vitre -->
<rect x="212" y="248" width="10" height="94" fill="currentColor" opacity=".18"/>
<rect x="212" y="248" width="10" height="94" fill="none" stroke="currentColor" stroke-width="1.6"/>
<rect x="210" y="242" width="16" height="106" fill="none" stroke="currentColor" stroke-width="2" opacity=".55"/>

<!-- bac à cendres -->
<rect x="240" y="352" width="100" height="40" fill="none" stroke="currentColor" stroke-width="2"/>
<line x1="234" y1="372" x2="240" y2="372" stroke="currentColor" stroke-width="3"/>
<path d="M246,386 C262,378 282,390 302,382 C316,378 328,386 334,386 L334,390 L246,390 Z" fill="currentColor" opacity=".3"/>

<!-- conduit + extracteur + sortie -->
<path d="M385,228 L420,228 L420,370" fill="none" stroke="currentColor" stroke-width="2" opacity=".75"/>
<circle cx="420" cy="392" r="22" fill="none" stroke="currentColor" stroke-width="2"/>
<g stroke="currentColor" stroke-width="1.6" opacity=".7">
<line x1="420" y1="392" x2="420" y2="374"/><line x1="420" y1="392" x2="436" y2="401"/><line x1="420" y1="392" x2="404" y2="401"/>
</g>
<path d="M442,392 L500,392" fill="none" stroke="currentColor" stroke-width="2" marker-end="url(#a)"/>
<text x="504" y="388" font-size="11.5" fill="currentColor" opacity=".6">fumées</text>

<!-- ventilateur convection -->
<circle cx="420" cy="300" r="16" fill="none" stroke="currentColor" stroke-width="1.8" opacity=".7"/>
<g stroke="currentColor" stroke-width="1.4" opacity=".6">
<line x1="420" y1="300" x2="420" y2="287"/><line x1="420" y1="300" x2="431" y2="307"/><line x1="420" y1="300" x2="409" y2="307"/>
</g>
<text x="392" y="286" font-size="11.5" fill="currentColor" opacity=".6" text-anchor="end">ventilateur</text>

<!-- bougie -->
<line x1="322" y1="298" x2="310" y2="306" stroke="#C9531A" stroke-width="3.4" stroke-linecap="round"/>
<!-- grille d'air -->
<path d="M508,440 L466,440" fill="none" stroke="currentColor" stroke-width="2" marker-end="url(#a)"/>
<g stroke="currentColor" stroke-width="1.8" opacity=".7">
<line x1="460" y1="430" x2="460" y2="450"/><line x1="454" y1="432" x2="454" y2="448"/>
</g>
<text x="512" y="436" font-size="11.5" fill="currentColor" opacity=".6">air</text>

<!-- ============ BADGES ============ -->
<g font-size="11.5" font-weight="700" text-anchor="middle">
<circle cx="240" cy="306" r="11" fill="none" stroke="#2E8B62" stroke-width="2"/><text x="240" y="310" fill="#2E8B62">1</text>
<circle cx="222" cy="372" r="11" fill="none" stroke="#2E8B62" stroke-width="2"/><text x="222" y="376" fill="#2E8B62">2</text>
