<circle cx="362" cy="264" r="11" fill="none" stroke="#B4892C" stroke-width="2"/><text x="362" y="268" fill="#B4892C">4</text>
<circle cx="196" cy="105" r="11" fill="none" stroke="#B4892C" stroke-width="2"/><text x="196" y="109" fill="#B4892C">5</text>
<circle cx="192" cy="242" r="11" fill="none" stroke="#B4892C" stroke-width="2"/><text x="192" y="246" fill="#B4892C">6</text>
<circle cx="446" cy="222" r="11" fill="none" stroke="#3A83B8" stroke-width="2"/><text x="446" y="226" fill="#3A83B8">7</text>
<circle cx="472" cy="118" r="11" fill="none" stroke="#3A83B8" stroke-width="2"/><text x="472" y="122" fill="#3A83B8">8</text>
<circle cx="440" cy="452" r="11" fill="none" stroke="#3A83B8" stroke-width="2"/><text x="440" y="456" fill="#3A83B8">9</text>
<circle cx="392" cy="414" r="11" fill="none" stroke="#C9531A" stroke-width="2"/><text x="392" y="418" fill="#C9531A">10</text>
<circle cx="338" cy="312" r="11" fill="none" stroke="#C9531A" stroke-width="2"/><text x="338" y="316" fill="#C9531A">11</text>
<circle cx="446" cy="336" r="11" fill="none" stroke="#C9531A" stroke-width="2"/><text x="446" y="340" fill="#C9531A">12</text>
</g>

<!-- ============ LÉGENDE ============ -->
<line x1="40" y1="516" x2="720" y2="516" stroke="currentColor" stroke-width="1" opacity=".2"/>

<g font-size="12.5">
<rect x="40" y="540" width="9" height="9" fill="#2E8B62"/>
<text x="58" y="549" font-size="11.5" font-weight="700" fill="#2E8B62" letter-spacing=".6">TOUS LES 2 À 3 JOURS</text>
<text x="40" y="572" fill="currentColor"><tspan font-weight="700" fill="#2E8B62">1</tspan>  Creuset</text>
<text x="40" y="592" fill="currentColor"><tspan font-weight="700" fill="#2E8B62">2</tspan>  Bac à cendres</text>
<text x="40" y="612" fill="currentColor"><tspan font-weight="700" fill="#2E8B62">3</tspan>  Vitre</text>

<rect x="280" y="540" width="9" height="9" fill="#B4892C"/>
<text x="298" y="549" font-size="11.5" font-weight="700" fill="#B4892C" letter-spacing=".6">CHAQUE SEMAINE</text>
<text x="280" y="572" fill="currentColor"><tspan font-weight="700" fill="#B4892C">4</tspan>  Chambre de combustion</text>
<text x="280" y="592" fill="currentColor"><tspan font-weight="700" fill="#B4892C">5</tspan>  Racleurs de l'échangeur</text>
<text x="280" y="612" fill="currentColor"><tspan font-weight="700" fill="#B4892C">6</tspan>  Joint de porte</text>

<rect x="530" y="540" width="9" height="9" fill="#3A83B8"/>
<text x="548" y="549" font-size="11.5" font-weight="700" fill="#3A83B8" letter-spacing=".6">CHAQUE MOIS</text>
<text x="530" y="572" fill="currentColor"><tspan font-weight="700" fill="#3A83B8">7</tspan>  Conduits internes</text>
<text x="530" y="592" fill="currentColor"><tspan font-weight="700" fill="#3A83B8">8</tspan>  Réservoir à pellets</text>
<text x="530" y="612" fill="currentColor"><tspan font-weight="700" fill="#3A83B8">9</tspan>  Grille d'entrée d'air</text>

<rect x="40" y="654" width="9" height="9" fill="#C9531A"/>
<text x="58" y="663" font-size="11.5" font-weight="700" fill="#C9531A" letter-spacing=".6">UNE FOIS PAR AN — PAR UN PROFESSIONNEL</text>
<text x="40" y="690" fill="currentColor"><tspan font-weight="700" fill="#C9531A">10</tspan>  Extracteur de fumées</text>
<text x="280" y="690" fill="currentColor"><tspan font-weight="700" fill="#C9531A">11</tspan>  Bougie d'allumage</text>
<text x="530" y="690" fill="currentColor"><tspan font-weight="700" fill="#C9531A">12</tspan>  Sondes et pressostat</text>
</g>
</svg>
